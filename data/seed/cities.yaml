# Moon-day locations (MD-03, ADR-0019). Calendars are computed and stored per city.
# The first 10 use exactly the coordinates of the owner-verified golden fixtures
# (backend/tests/fixtures/moon/generator/*.json). Others: city-centre coordinates; moon
# dates depend on the location only through local sunrise, so a few km don't matter.
# slug: ASCII kebab-case, <= 24 chars (it goes into callback data). Polar cities are not
# allowed (no sunrise on some days). Add a city: append it here, deploy; the next tick
# computes its calendars.
default: mysuru
