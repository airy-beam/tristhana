# Series and shared blocks (AC-01). Source of truth for content: notes `08 Asana Catalog`.
# Order of `items` is the practice order. Items are identified by `asana` + `variant`
# (natural key, ADR-0010), never by position.
# stop: a practice can end here · optional: only when enabled (teacher/shala) ·
# milestone: given by a teacher (progression, PR-08). Optional items are never stops.
# Practice order: opening -> standing -> series -> backbending -> finishing.
# Advanced C is pending (owner will provide it); Advanced D is a placeholder. Both stay empty.
sequences:
  - slug: opening
    kind: block
    status: confirmed
    names: {en: Opening (sun salutations), ru: Вступление (приветствия солнцу)}
    items:
      - {asana: surya-namaskara, variant: a}
      - {asana: surya-namaskara, variant: b}
