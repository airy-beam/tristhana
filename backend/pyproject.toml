[project]
name = "tristhana"
version = "0.1.0"
description = "Tristhana: Ashtanga yoga practice platform (API + Telegram bot)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiogram>=3.22,<4",
    "fastapi>=0.143.5",
    "fluent-runtime>=0.4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.16.0",
    "pyswisseph>=2.10.3.2",
    "pyyaml>=6.0.3",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tristhana-dev = "tristhana.dev:main"
tristhana-serve = "tristhana.serve:main"
tristhana-openapi = "tristhana.openapi_dump:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts; fake test credentials

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: long golden runs (full 2025-2100 parity); run with -m slow"]

[tool.importlinter]
root_package = "tristhana"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers: adapters -> application -> domain"
type = "layers"
layers = [
    "tristhana.api | tristhana.bots | tristhana.jobs | tristhana.infrastructure",
    "tristhana.moon",
    "tristhana.application",
    "tristhana.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application are pure (no frameworks, no wiring)"
type = "forbidden"
source_modules = ["tristhana.domain", "tristhana.application"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "uvicorn",
    "pydantic_settings",
    "tristhana.settings",
    "tristhana.logs",
    "tristhana.main",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[[tool.importlinter.contracts]]
name = "aiogram is imported only in bots.telegram"
type = "forbidden"
# The composition root (main) wires adapters, so only direct imports are forbidden.
allow_indirect_imports = true
source_modules = [
    "tristhana.domain",
    "tristhana.application",
    "tristhana.infrastructure",
    "tristhana.api",
    "tristhana.jobs",
    "tristhana.main",
]
forbidden_modules = ["aiogram"]

[[tool.importlinter.contracts]]
name = "swisseph is imported only in tristhana.moon"
type = "forbidden"
# The composition root (main) wires adapters, so only direct imports are forbidden.
allow_indirect_imports = true
source_modules = [
    "tristhana.domain",
    "tristhana.application",
    "tristhana.infrastructure",
    "tristhana.api",
    "tristhana.bots",
    "tristhana.jobs",
    "tristhana.main",
]
forbidden_modules = ["swisseph"]

[[tool.importlinter.contracts]]
name = "moon is pure computation (no frameworks, no wiring)"
type = "forbidden"
source_modules = ["tristhana.moon"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "uvicorn",
    "pydantic_settings",
    "tristhana.settings",
    "tristhana.logs",
    "tristhana.main",
]

[[tool.importlinter.contracts]]
name = "yaml is imported only in tristhana.infrastructure"
type = "forbidden"
# The composition root (main) wires adapters, so only direct imports are forbidden.
allow_indirect_imports = true
source_modules = [
    "tristhana.domain",
    "tristhana.application",
    "tristhana.api",
    "tristhana.bots",
    "tristhana.jobs",
    "tristhana.moon",
    "tristhana.main",
]
forbidden_modules = ["yaml"]

[[tool.importlinter.contracts]]
name = "domain does not use pydantic (plain dataclasses)"
type = "forbidden"
source_modules = ["tristhana.domain"]
forbidden_modules = ["pydantic"]

[[tool.importlinter.contracts]]
name = "fluent is imported only in tristhana.infrastructure"
type = "forbidden"
source_modules = [
    "tristhana.domain",
    "tristhana.application",
    "tristhana.api",
    "tristhana.bots",
    "tristhana.jobs",
    "tristhana.moon",
    "tristhana.main",
]
forbidden_modules = ["fluent"]
allow_indirect_imports = true
