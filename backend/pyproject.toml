[project]
name = "tristhana"
version = "0.1.0"
description = "Tristhana: Ashtanga yoga practice platform (API + Telegram bot)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiogram>=3.22,<4",
    "alembic>=1.16",
    "asyncpg>=0.30",
    "fastapi>=0.143.5",
    "fluent-runtime>=0.4",
    "httptools>=0.6",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.16.0",
    "pynacl>=1.5",
    "pyswisseph>=2.10.3.2",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.40",
    "tzdata>=2026.5",
    "segno>=1.6.6",
    "tzfpy>=2.1.1",
    "uvicorn>=0.54.0",
    "uvloop>=0.21",
    "pillow>=11",
]

[project.scripts]
tristhana-dev = "tristhana.dev:main"
tristhana-serve = "tristhana.serve:main"
tristhana-openapi = "tristhana.openapi_dump:main"
tristhana-migrate = "tristhana.infrastructure.db.migrate:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts; fake test credentials

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: long golden runs (full 2025-2100 parity); run with -m slow",
    "db: needs a real Postgres (TEST_DATABASE_URL); skipped locally without it",
]

[tool.importlinter]
root_package = "tristhana"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers: adapters -> application -> domain"
type = "layers"
layers = [
    "tristhana.api | tristhana.bots | tristhana.jobs | tristhana.infrastructure",
    "tristhana.moon",
    "tristhana.application",
    "tristhana.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application are pure (no frameworks, no wiring)"
type = "forbidden"
source_modules = ["tristhana.domain", "tristhana.application"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "uvicorn",
    "pydantic_settings",
    "tristhana.settings",
    "tristhana.logs",
    "tristhana.main",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "icalendar>=7.3.0",
    "import-linter>=2.15",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
    "watchfiles>=1.0",
]

[[tool.importlinter.contracts]]
name = "My schedule reads no log, rest, check-in or moon use case (SC-03, ADR-0035)"
type = "forbidden"
# Direct imports: `ports.storage` (the Clock) re-exports every port, so indirect paths exist
# without any read; the port shape (`member_windows`) is what keeps the data out.
allow_indirect_imports = true
source_modules = ["tristhana.application.classes"]
forbidden_modules = [
    "tristhana.application.ports.practice",
    "tristhana.application.ports.diary",
    "tristhana.application.ports.check_in",
    "tristhana.application.ports.rest_periods",
    "tristhana.application.ports.progression",
    "tristhana.application.moon",
]

[[tool.importlinter.contracts]]
name = "The calendar feed reads no log, rest, check-in or teacher view (SC-06, ADR-0036)"
type = "forbidden"
# Direct imports, as the My schedule contract: `ports.storage` re-exports every port.
allow_indirect_imports = true
source_modules = ["tristhana.application.calendar_feed"]
forbidden_modules = [
    "tristhana.application.ports.practice",
    "tristhana.application.ports.diary",
    "tristhana.application.ports.check_in",
    "tristhana.application.ports.rest_periods",
    "tristhana.application.ports.progression",
    "tristhana.application.ports.teacher_view",
]

[[tool.importlinter.contracts]]
name = "Attendance reads and writes no log, rest, check-in, diary or progression (SC-05, ADR-0039)"
type = "forbidden"
# Direct imports, as the My schedule contract: `ports.storage` re-exports every port.
allow_indirect_imports = true
source_modules = [
    "tristhana.application.attendance",
    "tristhana.infrastructure.db.attendance",
    "tristhana.api.v1.attendance",
    "tristhana.bots.telegram.attendance",
