# One word per thing (UI-06 stage 5, ADR-0050). The source of truth for the words the bot, the
# Mini App and the guides use, in English and in Russian. The ux-writer reads it before writing
# copy; a new concept with a new word is a line here in the same pull request.
#
# Read by site/src/lib/words.test.mjs (the site suite):
#   - no message text of bot.ftl, card.ftl or the Mini App's .ftl (en, ru) contains a `retired`
#     word of its language, or a `banned` one, outside `except`; only what a person reads is
#     scanned (values and attributes, every variant, variables removed), never ids or comments;
#   - the same for the guide pages: titles, descriptions and prose, without :ftl[…], :cmd[…],
#     code, link targets and image paths;
#   - a key both products define renders the same text, unless `same-key-different-text` says
#     why not.
#
# A retired or banned word is a regular expression (case-insensitive, Unicode), matched as whole
# words: a letter or digit may not touch either end. Write it in 'single quotes' so `\p{L}` stays.
# It is either a plain string (every message and every guide page of that language), or a map:
#   word:    the expression
#   in:      only these message keys (`prefix-*` for a prefix); never guide pages
#   guides:  false = messages only (the guides' Commands page names commands on purpose)
# `except` (per concept, and under `banned`): `key` (optionally `source: bot | app`) or `page`
# (as below), always with a `reason`.
#
# File names in `pending` and `except`:
#   bot/<locale>/…     backend/src/tristhana/infrastructure/i18n/locales/<locale>/…
#   app/<locale>/…     miniapp/src/locales/<locale>/…
#   guides/…           site/src/content/docs/… (Russian pages under guides/ru/…)

concepts:
  - concept: The calendar and numbers place
    en: My practice
    ru: Моя практика
    where: [stats-title, menu-practice, stats-show-ladies, tab-practice]
    note: Q342, QA (Q361). The tab keeps the short form 📊 Practice / «📊 Практика».
    retired:
      en:
        - word: '(?<!my )practice'
          in: [stats-title, menu-practice, stats-show-ladies, tab-practice]
      ru:
        - word: '(?<!мо(?:я|ей|ю|ею) )практик\p{L}*'
          in: [stats-title, menu-practice, stats-show-ladies, tab-practice]
    except:
      - key: tab-practice
        source: app
        reason: >-
          A tab is about 102 px at 320 px; «📊 Моя практика» would be cut. The heading under it
          says My practice (QA, Q361).

  - concept: A logged practice
    en: 🧘 Practiced (legend Practice)
    ru: 🧘 Практика (legend Практика)
    where: [status-practiced, stats-legend-practiced]
    note: Q342, kept; 📊 and 🧘 tell the place from the status.

  - concept: The student's own practice, how far it goes
    en: 'My practice: … / Your practice: …'
    ru: 'Моя практика: … / Твоя практика: …'
    where: [preset-mine, progression-current]
    expert: true
    note: The Ashtanga sense, kept by the ashtanga-expert.

  - concept: How far in the series
    en: 📏 How far
    ru: 📏 Объём практики
    where: [practice-length]
    expert: true
    note: QD (Q364).
    retired:
      en:
        - word: 'length'
          in: [practice-length]

  - concept: Minutes
    en: ⏱ How long
    ru: Длительность
    where: [practice-duration, class-form-length]
    note: QD (Q364); the same word in the practice details and on the class form.
    retired:
      en:
        - word: 'duration|length'
          in: [practice-duration, class-form-length]
      ru:
        - word: 'сколько длится'
          in: [practice-duration, class-form-length]

  - concept: The record of days
    en: log
    ru: журнал
    where: [everywhere]

  - concept: Private text on a day
    en: 📓 Note
    ru: 📓 Заметка
    where: [diary-*, consents, More]
    retired:
      en: ['diar(?:y|ies)']
      ru: ['дневник\p{L}*']

  - concept: How you feel after practice
    en: ✨ How do you feel? (noun how you feel; trends ✨ How you've felt)
    ru: ✨ Как самочувствие? (самочувствие; «✨ Самочувствие за год»)
    where: [checkin-*, trends-*, settings-checkin-hint, consents]
    note: >-
      settings-checkin-hint names the app's chips Mood / Body / Mind (Настроение / Тело / Ум);
      checkin-clear says Remove answers / «Убрать ответы».
    retired:
      en:
        - 'check[- ]?ins?'
        - word: 'energy|effort'
          in: [settings-checkin-hint]
      ru:
        - word: 'отметк\p{L}*'
          in: [checkin-*, trends-*, settings-checkin-hint]
        - word: 'энерги\p{L}*|усили\p{L}*'
          in: [settings-checkin-hint]
        - word: 'самочувстви\p{L}*'
          in: [checkin-clear]

  - concept: Practice details
    en: 📝 Details · 📝 Add details
    ru: 📝 Детали
    where: [practice-details, the day card]

  - concept: A consent's full text
    en: 📄 Read in full
    ru: 📄 Подробнее
    where: [consent-details]
    note: The bot and ask.ftl, byte for byte (ADR-0049).
    retired:
      en:
        - word: 'details'
          in: [consent-details]

  - concept: The day's third choice
    en: Other…
    ru: Другое…
    where: [today-other, remind-other]
    note: >-
      Only these two. Elsewhere a label says what it opens: preset-other 🎯 Choose… / «🎯
      Выбрать…»; day-off-ask-other Pick days… / «Выбрать дни…»; class-form-length-other Enter
      minutes / «Ввести минуты»; the bot's pause-other is the app's (same-key test).
    retired:
      en:
        - word: 'other'
          in: [preset-other, day-off-ask-other, class-form-length-other]
      ru:
        - word: 'друг\p{L}*'
          in: [preset-other, day-off-ask-other, class-form-length-other]

  - concept: One session at a shala
    en: class
    ru: занятие
    where: [everywhere]
    note: RU «класс» only after a hyphen («Лед-класс», «майсор-класс»).
    retired:
      ru:
        - 'урок(?:а|у|ом|е|и|ов|ам|ами|ах)?'
        - '(?<!-)класс(?:а|у|ом|е|ы|ов|ам|ами|ах)?'

  - concept: Class kinds
    en: Mysore · Led · 1:1 · Self-practice
    ru: Майсор · Лед-класс · Индивидуально · Самостоятельно
    where: [context-*, the class form]
    expert: true
    note: >-
      The RU comment example in miniapp/src/locales/ru/shala.ftl reads «Лед-класс Первая серия
      целиком» (decision 2026-10-19); comments are not scanned.

  - concept: My week of classes
    en: 🗓 My schedule
    ru: 🗓 Моё расписание
    where: [menu-classes, command-schedule, welcome-shala-student, my-schedule-*]
    note: QB (Q362). Classes / «Занятия» is not a place.
    retired:
      en:
        - word: 'classes'
          in: [menu-classes, command-schedule]
        - word: '→ classes'
          in: [welcome-shala-student]
      ru:
        - word: 'занятия'
          in: [menu-classes, command-schedule]
        - word: '→ занятия'
          in: [welcome-shala-student]

  - concept: A shala's timetable
    en: 🗓 Schedule
    ru: 🗓 Расписание
    where: [the shala card]

  - concept: Passing a link on
    en: ✉️ Send the link
    ru: ✉️ Отправить ссылку
    where: [invite-send, invite-share, invite-hint, shala-join-hint]
    note: >-
      Both invites, both products. The hints say Send this link or show the QR code. / «Отправь
      ссылку или покажи QR-код.»
    retired:
      en:
        - word: 'share'
          in: [invite-send, invite-share, invite-hint, shala-join-hint]
      ru:
        - word: 'подел\p{L}*'
          in: [invite-send, invite-share, invite-hint, shala-join-hint]

  - concept: Share a picture
    en: Share
    ru: Поделиться
    where: [share-*]

  - concept: Joining a shala
    en: join
    ru: присоединиться
    where: [hints, consents, feed-moon-only]
    note: RU in sentences only, never on a button (too long).
    retired:
      ru: ['вступ(?:ить|ишь|ит|им|ите|ят|и|ай|ил|ила|или|ив|ивший|ает|аешь|ают)']

  - concept: People with a role in a shala
    en: staff
    ru: команда шалы
    where: [the shala card, setup-staff, consents]
    note: EN setup-staff says Invite teachers and staff, as the card's Teachers and staff.
    retired:
      en:
        - word: 'invite teachers(?! and staff)'
          in: [setup-staff]

  - concept: Teacher
    en: teacher
    ru: учитель (on my list) · преподаватель (a role in a shala)
    where: [everywhere]
    note: ID-07 rule, kept.

  - concept: Moon day
    en: 🌙 Moon day · Full moon / New moon
    ru: 🌙 Лунный день · Полнолуние / Новолуние
    where: [moon-*]
    expert: true

  - concept: Rest, day off, ladies' holiday, no practice
    en: Rest day · Day off · Ladies' holiday · No practice
    ru: День отдыха · Выходной · Женские дни · Без практики
    where: [everywhere]
    note: The tone words are under `banned`.

  - concept: Where times are told
    en: 'My city · 🕐 Times: Almaty'
    ru: 'Мой город · 🕐 Время: Алматы'
    where: [settings, reminders, moon, schedule]
    retired:
      en: ['time ?zones?']
      ru: ['часов\p{L}* пояс\p{L}*']
    except:
      - key: settings-privacy-location
        reason: The location-privacy line says what the location is used for, exactly.
      - key: settings-zone-utc
        reason: The UTC option (it names no zone today; kept free to).
      - key: settings-city-utc
        reason: The UTC option (it names no zone today; kept free to).

  - concept: Product name
    en: Tristhana
    ru: Tristhana (never declined; where a case is needed, «приложение»)
    where: [start-greeting, bot-description, startup-failed, not-in-telegram, session-expired]
    note: QF (Q366). Voice-overs keep their own spelling.
    retired:
      ru: ['тристхан\p{L}*']

  - concept: Getting somewhere in the bot
    en: ☰ Menu → 🌙 Moon days
    ru: ☰ Меню → 🌙 Лунные дни
    where: [running text]
    note: >-
      QC (Q363). No message names a command; the commands stay in Telegram's command menu and on
      the guides' Commands page (:cmd[…] is not prose). /admin is the admin's own note.
    retired:
      en:
        - word: '/(?:start|schedule|moon|settings|help|log|asanas|remind|teachers|classes|menu)'
          guides: false
      ru:
        - word: '/(?:start|schedule|moon|settings|help|log|asanas|remind|teachers|classes|menu)'
          guides: false

  - concept: Extra fields of a form
    en: More options
    ru: Дополнительно
    where: [class-form-more]
    retired:
