        - word: 'ещё настройки'
          in: [class-form-more]

  - concept: Removing my own entry · deleting for everyone
    en: Remove · Delete
    ru: Убрать · Удалить
    where: [everywhere]
    retired:
      ru:
        - word: 'удал\p{L}*'
          in: [diary-clear, diary-clear-confirm, diary-clear-yes]
        - word: 'удален\p{L}*'
          in: [diary-removed]

  - concept: The class form's rhythm
    en: Regularly · One date; How often every week / every 2 weeks
    ru: Регулярно · Одна дата; «Повторяется по дням»
    where: [class-form-weekly, class-form-once]
    retired:
      en:
        - word: 'every week'
          in: [class-form-weekly]
      ru:
        - word: 'каждую неделю'
          in: [class-form-weekly]

# Never, anywhere: the tone rule (supportive, never guilt-inducing). «серия» is the series, so
# only its run phrases are banned; «практик подряд» stays. «пропуск» is the noun (a miss): the
# verb «пропускает» (a reminder passes over a day off) is not a judgement.
banned:
  en: ['streaks?', 'missed', 'skipped', 'broken']
  ru:
    - 'полос(?:а|ы|е|у|ой|ою)'
    - 'пропуск(?:а|у|ом|е|и|ов|ам|ами|ах)?'
    - 'пропущенн\p{L}*'
    - 'сери\p{L}* (?:из )?(?:дней|практик)'
    - '(?:прерв|прерыв|сохран)\p{L}* сери\p{L}*'
    - 'дней подряд'
  except:
    - key: closure-failed
      reason: The longest a shala may close (up to 92 days in a row), not a run of practice.
    - page: guides/ru/staff/closures-and-swaps.md
      reason: The longest a shala may close (up to 92 days in a row), not a run of practice.

# A key both products define, rendered differently on purpose. `locale` limits an entry to one
# language; without it the entry covers both.
same-key-different-text:
  - key: ann-pinned-until
    reason: >-
      The app's line sits on the announcement's own card, where 📌 says pinned; the bot's list
      line spells it out.
  - key: attend-removed
    reason: The bot's message names the mark it removed; the app's line sits under that row.
  - key: attend-roster-hint
    reason: The bot's roster is a column of name buttons, the app's a list of ticks.
  - key: attend-staff-open
    reason: The app's button carries the counts; the bot's opens the roster that shows them.
  - key: attend-staff-tag
    reason: The bot joins the tag to the name with " · "; the app sets it apart as a tag.
  - key: delete-explain
    reason: The bot adds a line on the messages already in its chat, which only the bot has.
  - key: diary-removed
    reason: The bot adds a line on the messages already in its chat, which only the bot has.
  - key: feed-copy
    reason: A bot button carries its emoji; the app's is a plain button beside the link.
  - key: length-pick-range
    reason: The bot asks in a message; the app labels a field.
  - key: progression-pick-series
    reason: The bot asks in a message; the app labels a field.
  - key: progression-pick-asana
    reason: The bot asks in a message (with the series); the app labels a field.
  - key: moon-same-as-city
    reason: >-
      A bot button carries its emoji, as its neighbours 👥 Follow my teacher and 🏛 Follow my
      shala do; the app's is a choice in a list.
  - key: practice-length
    reason: The bot's button carries the emoji; the app's is a field label beside its value.
  - key: practice-duration
    reason: The bot's button carries the emoji; the app's is a field label beside its value.
  - key: remind-days-follow
    reason: >-
      The bot's status line just above already names the days, and its 😌 Day off button is on
      the same screen; the app's hint stands alone under its switch, so it names both.
  - key: progression-title
    reason: A bot message heading carries the emoji; the app's screen heading does not.
  - key: settings-title
    reason: A bot message heading carries the emoji; the app's screen heading does not.
  - key: schedule-title
    reason: The bot's heading names the shala and the week; the app shows both on the card.
  - key: shala-staff-title
    reason: The bot lists the people on the heading's line; the app lists them under it.

