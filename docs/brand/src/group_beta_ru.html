<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
body { background: #f3e9d6; color: #1c1f4d; }
.card { position: relative; width: 1280px; height: 960px; padding: 80px 90px 76px; display: grid; grid-template-columns: 1fr 380px; gap: 40px; overflow: hidden;
  background: radial-gradient(90% 80% at 85% 20%, #fbf5ea 0%, #f3e9d6 60%, #ead9b5 100%); }
.left { display: flex; flex-direction: column; }
.hi { font-size: 36px; color: #c8732a; font-weight: 700; }
.title { font-family: "Noto Serif Display", "Noto Serif", serif; font-size: 70px; line-height: 1.05; margin-top: 14px; font-weight: 600; }
.sub { font-size: 31px; line-height: 1.35; margin-top: 22px; color: #3a3d66; }
.chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
.chip { background: #1c1f4d; color: #f3e9d6; border-radius: 999px; padding: 10px 22px; font-size: 26px; }
.go { margin-top: auto; display: flex; align-items: center; gap: 22px; font-size: 38px; }
.go b { font-family: "Noto Serif Display", "Noto Serif", serif; font-size: 52px; color: #1c1f4d; }
.go .arrow { background: #e8a33d; color: #1c1f4d; border-radius: 999px; padding: 10px 26px; font-weight: 900; font-size: 32px; }
.right { display: flex; flex-direction: column; align-items: center; justify-content: center; }
.right svg { width: 340px; height: 340px; filter: drop-shadow(0 18px 30px rgba(28,31,77,.25)); }
.right .name { font-family: "Noto Serif Display", "Noto Serif", serif; font-size: 52px; margin-top: 26px; }
.right .tag { font-size: 19px; letter-spacing: 3px; color: #c8732a; margin-top: 6px; white-space: nowrap; }
</style></head><body><div class="card">
<div class="left">
  <div class="hi">Друзья, привет! 🙏</div>
  <div class="title">Попробуйте наш дневник практики</div>
  <div class="sub">Tristhana — аштанга в Telegram: отметить практику или отдых можно одним касанием. Ищу первых тестировщиков.</div>
  <div class="chips"><span class="chip">🧘 практика и отдых</span><span class="chip">🌙 лунные дни</span><span class="chip">🔔 мягкие напоминания</span><span class="chip">📊 статистика без соревнований</span></div>
  <div class="go"><span class="arrow">/start</span><b>@tristhana_bot</b></div>
</div>
<div class="right"><svg viewBox="0 0 640 640"><defs><mask id="c"><circle cx="320" cy="176" r="54" fill="#fff"/><circle cx="342" cy="162" r="48" fill="#000"/></mask></defs><rect width="640" height="640" rx="320" fill="#2d3170"/><rect width="640" height="640" fill="#f3e9d6" mask="url(#c)"/><g stroke="#f3e9d6" stroke-opacity=".22" stroke-width="5"><line x1="320" y1="318" x2="226" y2="480"/><line x1="320" y1="318" x2="414" y2="480"/><line x1="226" y1="480" x2="414" y2="480"/></g><circle cx="320" cy="318" r="40" fill="#f3e9d6"/><circle cx="226" cy="480" r="40" fill="#e8a33d"/><circle cx="414" cy="480" r="40" fill="#c8732a"/></svg>
<div class="name">Tristhana</div><div class="tag">ДЫХАНИЕ · БАНДХА · ДРИШТИ</div></div>
</div></body></html>
