<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
.pic { position: relative; width: 640px; height: 360px; overflow: hidden; display: flex; align-items: center; gap: 34px; padding: 0 48px; }
.pic .glow { position: absolute; right: -90px; top: -70px; width: 300px; height: 300px; border-radius: 50%; box-shadow: -34px 18px 0 0 rgba(243,233,214,0.07); }
.pic svg { width: 168px; height: 168px; flex: none; filter: drop-shadow(0 10px 18px rgba(0,0,0,.35)); }
.pic .name { font-family: "Noto Serif Display", "Noto Serif", serif; font-size: 62px; line-height: 1; letter-spacing: .5px; }
.pic .tagline { font-size: 15px; letter-spacing: 3.5px; text-transform: uppercase; color: var(--saffron); margin-top: 12px; white-space: nowrap; }
.pic .line { font-size: 21px; line-height: 1.35; color: #e9e3f2; font-weight: 300; margin-top: 20px; }
.pic .row { font-size: 26px; letter-spacing: 12px; margin-top: 16px; }

<div><div class="name">Tristhana</div><div class="tagline">Asana · Breath · Drishti</div>
