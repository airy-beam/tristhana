name: site

# UI-05: the public site (landing page + guides). The guides quote the product's own Fluent
# messages, so a change to a locale file or to the bot's command menu also runs these checks.
on:
  push:
    branches: [main]
    paths: &paths
      - "site/**"
      - "backend/src/tristhana/infrastructure/i18n/locales/**"
      - "miniapp/src/locales/**"
      - "tools/telegram/set_webhook.py"
      - ".github/workflows/site.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

# Third-party actions are pinned by commit SHA (tag in the comment).
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: guides match the product and each other (guide-check)
        run: npm run check:guide
      - run: npm run build
      - name: no requests to other sites
        run: node scripts/check-dist.mjs
  # Deploy job: added with the Hosting site (UI-05 step 6, an owner cloud step).
