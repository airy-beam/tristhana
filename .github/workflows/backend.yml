name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "data/seed/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "data/seed/**", ".github/workflows/backend.yml"]

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest
      - name: full moon-day parity (2025-2100, all cities)
        run: uv run pytest -m slow -q
