name: miniapp

on:
  push:
    branches: [main]
    paths: ["miniapp/**", "data/i18n/**", ".github/workflows/miniapp.yml"]
  pull_request:
    paths: ["miniapp/**", "data/i18n/**", ".github/workflows/miniapp.yml"]

permissions:
  contents: read

concurrency:
  group: miniapp-${{ github.ref }}
  cancel-in-progress: false

# Third-party actions are pinned by commit SHA (tag in the comment).
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: generated API types match openapi.json
        run: npm run check:api
      - run: npm run build
      - name: bundle budget (NF-09)
        run: npm run check:bundle

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # WIF; the provider only accepts tokens from refs/heads/main
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - name: deploy to Firebase Hosting (tristhana.web.app)
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: >-
          npx --yes firebase-tools@15.32.1 deploy --only hosting --project "$PROJECT"
          --non-interactive --message "$GITHUB_SHA"
      - name: smoke (index served, assets immutable)
        run: |
          html="$(curl -fsS https://tristhana.web.app/)"
          asset="$(grep -o '/assets/index-[^"]*\.js' <<<"$html" | head -1)"
          [[ -n "$asset" ]] || { echo "no entry script in index.html" >&2; exit 1; }
          curl -fsSI "https://tristhana.web.app$asset" | grep -i '^cache-control: .*immutable'
          curl -fsS -o /dev/null -w 'first load (index): %{time_total} s\n' https://tristhana.web.app/
